[Service]
# uvicorn wrote one access line per request into the journal, with the visitor address it gets
# forwarded from Caddy, and the journal kept it for a month. The privacy statement says the web
# server keeps IP addresses for seven days at most and that searches carry none; Caddy keeps the
# one access log that is needed. Set 2026-10-01; do not switch the uvicorn access log back on.
Environment=UVICORN_ACCESS_LOG=false
